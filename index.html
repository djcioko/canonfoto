<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Canon Studio Pro - Panasonic & Remote Edition</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #00ff88; }
        body { background: #000; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; }
        
        #modeSelector {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0a0a0a; z-index: 5000; display: flex;
            flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        }
        .btn-mode {
            width: 85%; max-width: 320px; padding: 20px; font-size: 18px; font-weight: bold;
            border-radius: 12px; border: 2px solid var(--accent); background: #151515;
            color: white; cursor: pointer; transition: 0.3s;
        }
        .btn-mode:active { transform: scale(0.95); background: var(--accent); color: black; }

        .viewport { 
            position: relative; width: 100vw; height: 100vh; background: #000;
            display: flex; align-items: center; justify-content: center;
        }
        video { width: 100%; height: 100%; object-fit: cover; background: #000; }

        .sidebar { 
            position: absolute; top: 0; left: 0; width: 300px; height: 100%; 
            background: rgba(10, 10, 10, 0.95); padding: 20px; 
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 2000;
            overflow-y: auto; border-right: 2px solid var(--accent); box-sizing: border-box;
        }
        .sidebar.hidden { transform: translateX(-300px); }
        
        #toggleMenu { 
            position: fixed; bottom: 20px; left: 20px; z-index: 3000; 
            background: var(--accent); color: black; border: none; padding: 10px 15px; 
            border-radius: 5px; font-weight: bold; cursor: pointer; opacity: 0.7; transition: 0.3s;
        }

        .card { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        h3 { font-size: 11px; color: var(--accent); margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 1px; }
        
        #countdown { 
            position: absolute; font-size: 300px; font-weight: bold; color: var(--accent); 
            z-index: 1500; text-shadow: 0 0 40px rgba(0,0,0,0.8); pointer-events: none; display: none; 
        }

        input[type="range"] { width: 100%; margin-top: 10px; accent-color: var(--accent); }
        .btn-main { width: 100%; padding: 15px; font-weight: bold; cursor: pointer; border: none; border-radius: 6px; margin-top: 10px; }
        .btn-snap { background: var(--accent); color: black; font-size: 18px; }

        #remoteView {
            display: none; width: 100vw; height: 100vh; flex-direction: column;
            align-items: center; justify-content: center; background: #000;
        }
        #status { font-size: 14px; color: #ff4757; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-remote { 
            width: 240px; height: 240px; border-radius: 50%; border: 10px solid #333;
            background: none; color: #333; font-size: 26px; font-weight: bold; cursor: pointer; transition: all 0.3s ease;
        }
        .connected .btn-remote { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 40px rgba(0,255,136,0.3); }
        .btn-remote:active { transform: scale(0.9); background: rgba(0,255,136,0.2); }
    </style>
</head>
<body id="body">

<div id="modeSelector">
    <h2 style="color:var(--accent); margin-bottom:5px;">CANON BOOTH PRO</h2>
    <p style="color:#888; margin-bottom:30px; font-size:14px;">Alege modul de utilizare:</p>
    <button class="btn-mode" onclick="setMode('booth')">📷 CABINĂ FOTO (PANASONIC)</button>
    <button class="btn-mode" onclick="setMode('remote')">📱 TELECOMANDĂ (TELEFON)</button>
</div>

<div class="viewport" id="mainArea" style="display:none;">
    <button id="toggleMenu">⚙️ MENIU</button>
    <div id="countdown">3</div>
    
    <div class="sidebar" id="sidebar">
        <div class="card">
            <h3>1. SELECTEAZĂ CANON</h3>
            <select id="camSelect" style="width:100%; background:#000; color:white; padding:10px; border: 1px solid #444;"></select>
            <button id="startBtn" class="btn-main" style="background:#444; color:white;">PORNEȘTE LIVE</button>
        </div>

        <div class="card">
            <h3>2. CONEXIUNI</h3>
            <div id="remoteStatus" style="color: #00ff88; font-size: 13px;">TELECOMANDĂ: AȘTEPTARE...</div>
            <div style="font-size: 11px; color: #888; margin-top: 5px;">Tasta: SPACE activă</div>
        </div>

        <div class="card">
            <h3>3. CONFIGURARE TIMER</h3>
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <label>Activare Timer:</label>
                <input type="checkbox" id="timerEnabled" checked style="width:20px; height:20px;">
            </div>
            <div style="margin-top:15px;">
                <label>Secunde: <span id="secVal" style="color:var(--accent); font-weight:bold;">3</span></label>
                <input type="range" id="timerSecs" min="1" max="5" value="3">
            </div>
        </div>

        <div class="card">
            <h3>4. OPTIMIZARE IMAGINE</h3>
            <label>Luminozitate</label>
            <input type="range" id="br" min="0" max="200" value="100">
            <label style="margin-top:10px;">Contrast</label>
            <input type="range" id="ct" min="50" max="150" value="100">
        </div>

        <button id="capBtn" class="btn-main btn-snap">FĂ POZA (SPACE)</button>
        <button id="fullScreenBtn" class="btn-main" style="background:#222; color:white; font-size:11px;">MOD FULL SCREEN</button>
    </div>

    <video id="video" autoplay playsinline></video>
</div>

<div id="remoteView">
    <div id="status">CĂUTARE TABLETĂ...</div>
    <button id="snapBtn" class="btn-remote" onclick="sendSnap()">FĂ POZA</button>
    <div style="margin-top: 30px; font-size: 11px; color: #444;">ID Sesiune: djcioko_canon_booth_2026_xyz</div>
</div>

<canvas id="procCanvas" style="display:none;"></canvas>

<script>
    const TARGET_ID = 'djcioko_canon_booth_2026_xyz';
    let peer = null, conn = null, wakeLock = null;

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {
            console.log("WakeLock inactive:", err.message);
        }
    }

    document.addEventListener('visibilitychange', () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            requestWakeLock();
        }
    });

    function setMode(mode) {
        document.getElementById('modeSelector').style.display = 'none';
        requestWakeLock();

        if (mode === 'booth') {
            document.getElementById('mainArea').style.display = 'flex';
            initBooth();
        } else {
            document.getElementById('remoteView').style.display = 'flex';
            initRemote();
        }
    }

    /* LOGICĂ CABINĂ FOTO */
    const v = document.getElementById('video'), sidebar = document.getElementById('sidebar');
    const timerEnabled = document.getElementById('timerEnabled'), timerSecs = document.getElementById('timerSecs'), secVal = document.getElementById('secVal');
    const countdown = document.getElementById('countdown'), brInput = document.getElementById('br'), ctInput = document.getElementById('ct');
    const camSelect = document.getElementById('camSelect');

    function initBooth() {
        if (peer) peer.destroy();
        peer = new Peer(TARGET_ID);

        peer.on('open', () => {
            document.getElementById('remoteStatus').innerText = "TELECOMANDĂ: AȘTEPTARE CONEXIUNE... ⏳";
        });

        peer.on('connection', (c) => {
            conn = c;
            document.getElementById('remoteStatus').innerText = "TELECOMANDĂ: CONECTATĂ ✅";
            
            conn.on('data', (data) => { 
                if(data === 'SNAP') startCapture(); 
            });

            conn.on('close', () => { 
                document.getElementById('remoteStatus').innerText = "TELECOMANDĂ: DECONECTATĂ ❌"; 
            });
        });

        peer.on('error', (err) => {
            if(err.type === 'unavailable-id') {
                setTimeout(initBooth, 2000);
            }
        });

        document.getElementById('toggleMenu').onclick = () => sidebar.classList.toggle('hidden');
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); startCapture(); }
        });

        document.getElementById('fullScreenBtn').onclick = () => {
            if (!document.fullscreenElement) document.getElementById('mainArea').requestFullscreen();
            else document.exitFullscreen();
        };

        timerSecs.oninput = () => { secVal.innerText = timerSecs.value; };
        document.getElementById('capBtn').onclick = startCapture;

        const applyFX = () => {
            v.style.filter = `brightness(${brInput.value}%) contrast(${ctInput.value}%)`;
            localStorage.setItem('booth_br', brInput.value);
            localStorage.setItem('booth_ct', ctInput.value);
        };
        brInput.oninput = applyFX; ctInput.oninput = applyFX;

        if(localStorage.getItem('booth_br')) brInput.value = localStorage.getItem('booth_br');
        if(localStorage.getItem('booth_ct')) ctInput.value = localStorage.getItem('booth_ct');
        applyFX();

        initOldCameraLogic();
    }

    async function initOldCameraLogic() {
        try {
            const devs = await navigator.mediaDevices.enumerateDevices();
            const cams = devs.filter(d => d.kind === 'videoinput');
            camSelect.innerHTML = cams.map((c, i) => `<option value="${c.deviceId}">${c.label || 'Camera '+(i+1)}</option>`).join('');
            
            const savedCam = localStorage.getItem('booth_selected_cam');
            if (savedCam && cams.some(c => c.deviceId === savedCam)) {
                camSelect.value = savedCam;
            }
        } catch (err) {
            console.error("Eroare la enumerarea dispozitivelor:", err);
        }
    }

    document.getElementById('startBtn').onclick = async () => {
        try {
            const selectedDevId = camSelect.value;
            const s = await navigator.mediaDevices.getUserMedia({
                video: {
                    deviceId: { exact: selectedDevId },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            });
            v.srcObject = s;
            localStorage.setItem('booth_selected_cam', selectedDevId);
        } catch (err) {
            alert("Eroare la pornirea camerei: " + err.message);
        }
    };

    function startCapture() {
        if (timerEnabled.checked) {
            let count = parseInt(timerSecs.value);
            countdown.style.display = 'block'; countdown.innerText = count;
            let interval = setInterval(() => {
                count--;
                if(count > 0) countdown.innerText = count;
                else { clearInterval(interval); countdown.style.display = 'none'; takePhoto(); }
            }, 1000);
        } else { takePhoto(); }
    }

    function takePhoto() {
        const can = document.getElementById('procCanvas'), ctx = can.getContext('2d');
        can.width = 3840; can.height = 2160; ctx.filter = v.style.filter;
        
        const videoRatio = v.videoWidth / v.videoHeight, canvasRatio = can.width / can.height;
        let sw, sh, sx, sy;
        if (videoRatio > canvasRatio) { sh = v.videoHeight; sw = v.videoHeight * canvasRatio; sx = (v.videoWidth - sw) / 2; sy = 0; }
        else { sw = v.videoWidth; sh = v.videoWidth / canvasRatio; sx = 0; sy = (v.videoHeight - sh) / 2; }

        ctx.drawImage(v, sx, sy, sw, sh, 0, 0, can.width, can.height);
        const link = document.createElement('a');
        link.download = `Booth_Canon_16-9_${Date.now()}.png`;
        link.href = can.toDataURL('image/png', 1.0);
        link.click();
    }

    /* LOGICĂ TELECOMANDĂ */
    function initRemote() {
        peer = new Peer();
        peer.on('open', () => tryConnect());
        peer.on('error', () => setTimeout(() => location.reload(), 3000));
    }

    function tryConnect() {
        document.getElementById('status').innerText = "ÎNCERCARE CONECTARE...";
        conn = peer.connect(TARGET_ID);

        conn.on('open', () => {
            document.getElementById('status').innerText = "CONECTAT LA TABLETĂ";
            document.getElementById('status').style.color = "#00ff88";
            document.getElementById('body').classList.add('connected');
        });

        conn.on('error', () => setTimeout(tryConnect, 3000));
        conn.on('close', () => {
            document.getElementById('status').innerText = "TABLETĂ DECONECTATĂ";
            document.getElementById('status').style.color = "#ff4757";
            document.getElementById('body').classList.remove('connected');
            setTimeout(tryConnect, 3000);
        });
    }

    function sendSnap() {
        if (conn && conn.open) {
            conn.send('SNAP');
            if(navigator.vibrate) navigator.vibrate(80);
        } else {
            alert("Telecomanda nu este conectată la tabletă!");
            tryConnect();
        }
    }
</script>
</body>
</html>
